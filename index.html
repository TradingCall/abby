        body {
            font-family: 'Nunito', sans-serif;

        .header {
            position: sticky;

            z-index: 100;
            background: rgba(15, 12, 41, 0.92);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header h1 {
            font-family: 'Pacifico', cursive;
            font-size: 1.35rem;
            color: #ffb6c1;
            letter-spacing: 0.5px;
        }

            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .music-btn:active { transform: scale(0.92); }

        /* Comic Container */
        .comic-container {
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Panel */
        .panel {
            position: relative;
            margin: 0 12px 28px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.45);
            background: #1a1a2e;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .panel-img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

            background: linear-gradient(135deg, #2b2b45, #1b1b2f);

            font-size: 0.95rem;
            color: #e0e0ff;
            border-top: 1px solid rgba(255,255,255,0.08);
